<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bibliotheca — taş tonozlu bir manastır kitaplığında binden fazla eser. Rafları döndür, bir cildi mum ışığında aç.">
  <title>Bibliotheca — Sanal Kütüphane</title>

  <!-- Yazı tipleri: gotik başlıklar için Grenze Gotisch, el yazması metin için EB Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Grenze+Gotisch:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --stone: #1b1714; --stone-2: #26211c; --mortar: #0d0b09;
      --oak-d: #1a110a; --oak: #352214; --oak-l: #563a22; --oak-hi: #74512f;
      --iron: #2a2826; --iron-l: #5d5850;
      --parch: #e9dbb6; --parch-l: #f4ead0; --parch-d: #cbb688;
      --ink: #2b1e14; --ink-soft: #5d4733;
      --rubric: #9c2b1b; --lapis: #2c4778; --gilt: #ad8538; --gilt-l: #d2b06a;
      --candle: 255, 176, 92;
      --display: 'Grenze Gotisch', 'EB Garamond', Georgia, serif;
      --serif: 'EB Garamond', Georgia, serif;
      /* doku görselleri (taş/deri ve parşömen) */
      --grain: url("assets/grain.png");          /* tools/dokular.py üretir */
      --grain-soft: url("assets/grain-soft.png"); /* kâğıt yüzeyler: sıcak tonlu, hafif */
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: var(--stone); color: var(--parch); font: 400 18px/1.5 var(--serif); -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; color: inherit; }
    a { color: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    :focus-visible { outline: 2px solid var(--gilt-l); outline-offset: 2px; }

    /* =========================================================
       ÜST BANT
       ========================================================= */
    header {
      position: fixed; top: 12px; left: 16px; right: 16px; z-index: 50;
      display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 10px 0 12px;
      border-radius: 16px;
      background: rgba(20, 14, 9, .62);
      -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
      box-shadow: inset 0 0 0 1px rgba(233,219,182,.10), 0 12px 32px -12px rgba(0,0,0,.7);
      font-size: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--parch-l); text-decoration: none; white-space: nowrap; border-radius: 10px; }
    .brand .mono {
      display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px;
      font: 700 24px/1 var(--display); color: var(--parch-l);
      background: linear-gradient(145deg, #b13a24, #7a2215);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 4px 10px -4px rgba(0,0,0,.6);
    }
    .brand .word { font: 700 24px/1 var(--display); letter-spacing: .01em; }

    .search { position: relative; flex: 1; max-width: 560px; margin: 0 auto; }
    .search .icon { position: absolute; left: 14px; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); color: rgba(233,219,182,.55); pointer-events: none; }
    .search input {
      width: 100%; height: 40px; padding: 0 44px 0 40px; border-radius: 999px;
      border: 1px solid rgba(233,219,182,.14); background: rgba(255,255,255,.06);
      color: var(--parch-l); font-size: 16px; outline: none;
      transition: background .15s, border-color .15s, box-shadow .15s;
    }
    .search input::placeholder { color: rgba(233,219,182,.5); font-style: italic; }
    .search input:hover { background: rgba(255,255,255,.09); }
    .search input:focus { background: rgba(255,255,255,.1); border-color: rgba(210,176,106,.6); box-shadow: 0 0 0 3px rgba(210,176,106,.18); }
    .search input::-webkit-search-cancel-button { filter: invert(.8) sepia(.4); cursor: pointer; }
    .search kbd {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; display: grid; place-items: center;
      font: 500 13px/1 var(--serif); color: rgba(233,219,182,.6);
      border: 1px solid rgba(233,219,182,.18); pointer-events: none;
    }
    .search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }

    /* ortak hap düğme */
    .btn {
      display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px;
      border: 1px solid rgba(233,219,182,.14); background: rgba(255,255,255,.06); color: var(--parch-l);
      cursor: pointer; white-space: nowrap; font-size: 16px;
      transition: background .15s, border-color .15s, transform .1s;
    }
    .btn:hover { background: rgba(255,255,255,.11); border-color: rgba(233,219,182,.24); }
    .btn:active { transform: translateY(1px); }
    .btn svg { width: 18px; height: 18px; flex: none; }
    .btn .count {
      min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center;
      background: #b13a24; color: #fff7e6; font-size: 12px; font-weight: 600;
    }

    /* görünüm seçici: üç bölümlü */
    .modes { display: flex; gap: 2px; padding: 3px; height: 40px; border-radius: 999px; border: 1px solid rgba(233,219,182,.14); background: rgba(255,255,255,.05); }
    .modes button {
      display: grid; place-items: center; width: 40px; border: 0; border-radius: 999px; cursor: pointer;
      background: transparent; color: rgba(233,219,182,.6); transition: background .15s, color .15s;
    }
    .modes button:hover { color: var(--parch-l); background: rgba(255,255,255,.07); }
    .modes button[aria-checked="true"] { color: #241608; background: linear-gradient(var(--gilt-l), var(--gilt)); }
    .modes svg { width: 22px; height: 16px; }
    .modes path { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }

    /* Arama sonuçları: yarı saydam, arkası bulanık panel */
    .search { position: relative; }
    .results {
      position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 2;
      max-height: min(62dvh, 520px); overflow-y: auto; overscroll-behavior: contain;
      margin: 0; padding: 6px; list-style: none; border-radius: 14px;
      background: rgba(22, 15, 9, .62);
      -webkit-backdrop-filter: blur(18px) saturate(1.25); backdrop-filter: blur(18px) saturate(1.25);
      box-shadow: inset 0 0 0 1px rgba(173,133,56,.38), 0 24px 60px -18px rgba(0,0,0,.85);
    }
    .results[hidden] { display: none; }
    .results li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
    .results li b { font: 700 20px/1.15 var(--display); color: var(--parch-l); }
    .results li i { grid-column: 1; color: rgba(233,219,182,.72); font-size: 16px; }
    .results li small { grid-row: 1 / 3; grid-column: 2; align-self: center; font-variant: small-caps; letter-spacing: .08em; color: var(--gilt-l); }
    .results li .near { font-style: normal; font-size: 13px; color: var(--gilt-l); margin-left: 6px; }
    .results li[aria-selected="true"], .results li:hover { background: rgba(233,219,182,.12); }
    .results .status { display: block; padding: 8px 14px; cursor: default; color: rgba(233,219,182,.72); font-style: italic; }
    .veil { /* arama açıkken sahne hafifçe bulanıklaşır ve kararır */
      position: fixed; inset: 0; z-index: 40; background: rgba(8,6,4,.38);
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    }
    .veil[hidden] { display: none; }

    /* Hafif mod (Düz görünüm): zayıf cihazlarda pahalı efektler kapanır */
    .lite .candle { animation: none; }
    .lite .drawer, .lite .results, .lite .veil { -webkit-backdrop-filter: none; backdrop-filter: none; }
    .lite .drawer { background: rgba(20, 14, 8, .97); }
    .lite .results { background: rgba(22, 15, 9, .97); }
    .lite .veil { background: rgba(8, 6, 4, .55); }
    .lite .shaft { filter: none; opacity: .6; }
    @media (max-width: 760px) {
      header { top: 8px; left: 8px; right: 8px; gap: 8px; height: 52px; padding: 0 6px 0 8px; }
      .brand .word, .btn .label, .search kbd { display: none; }
      .brand .mono { width: 34px; height: 34px; font-size: 22px; }
      .btn { padding: 0 10px; }
      .modes { padding: 3px; }
      .modes button { width: 34px; }
      .modes button[aria-checked="false"] { display: none; }   /* yalnızca etkin görünüm; dokununca sıradakine geçer */
    }

    /* =========================================================
       SALON: taş duvar, mum ışığı, ortada dışa bükük kitaplık
       ========================================================= */
    .stage {
      position: fixed; inset: 0; overflow: clip; touch-action: none; perspective-origin: 50% 50%;
      background:
        radial-gradient(ellipse 55% 50% at 50% 50%, rgba(var(--candle), .10), transparent 70%),
        var(--grain),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='96'><rect width='180' height='96' fill='%23201b17'/><rect x='2' y='2' width='86' height='44' fill='%23241f1a'/><rect x='92' y='2' width='86' height='44' fill='%231e1915'/><rect x='-44' y='50' width='86' height='44' fill='%231f1a16'/><rect x='46' y='50' width='86' height='44' fill='%23251f1a'/><rect x='136' y='50' width='86' height='44' fill='%231c1814'/></svg>"),
        var(--stone);
    }
    .stage::before { /* tavan ve zemin karanlığı */
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to bottom, rgba(5,4,3,.9), transparent 16%, transparent 82%, rgba(5,4,3,.85));
    }
    .stage::after { /* kenarları gölgeye gömen vinyet: silindirin uzaklaşan yanları kararır */
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background: radial-gradient(ellipse 70% 85% at 50% 50%, transparent 45%, rgba(4,3,2,.9) 100%);
    }
    .candle { /* iki yandaki mum ışığı, hafifçe titrer */
      position: absolute; bottom: -10%; width: 60vmax; height: 60vmax; pointer-events: none; z-index: 6;
      background: radial-gradient(circle, rgba(var(--candle), .16), rgba(var(--candle), .05) 35%, transparent 62%);
      animation: flicker 5.3s infinite;
    }
    .candle.l { left: -26vmax; } .candle.r { right: -26vmax; animation-duration: 6.1s; animation-delay: -2s; }
    @keyframes flicker {
      0%, 100% { opacity: .9; } 12% { opacity: .75; } 20% { opacity: 1; } 34% { opacity: .82; }
      47% { opacity: .95; } 58% { opacity: .7; } 66% { opacity: .92; } 80% { opacity: .8; }
    }

    .drum { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
    .drum > * { position: absolute; -webkit-backface-visibility: hidden; backface-visibility: hidden; }

    /* ---------- Kitaplık dilimleri: korniş + raf gözleri + kaide ---------- */
    .slice { display: flex; flex-direction: column; contain: layout style; }   /* yerleşim yalıtımı: bir dilimdeki değişiklik sayfanın geri kalanını yeniden hesaplatmaz */
    .slice .bk { position: absolute; }
    .lens { left: 0; top: 0; width: 0; height: 0; pointer-events: none; contain: layout style; }   /* dock merceği: büyüyen kitap kopyaları */
    .lens .bk { position: absolute; }
    .slice .cornice {
      height: var(--ch);
      background:
        linear-gradient(var(--gilt), var(--gilt)) bottom / 100% 1px no-repeat,
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='26'><path d='M3 26V13Q3 4 14 2Q25 4 25 13V26' fill='%23140c06' stroke='%238a6a34' stroke-width='1.2'/><circle cx='14' cy='12' r='3' fill='none' stroke='%238a6a34' stroke-width='1'/></svg>") var(--ox) calc(100% - 4px) / 28px calc(var(--ch) * .55) repeat-x,
        linear-gradient(to bottom, var(--oak-hi), var(--oak-l) 12%, var(--oak) 45%, var(--oak-d));
    }
    .slice .cab {
      flex: 1;
      background:
        repeating-linear-gradient(to bottom,
          transparent 0 var(--rh),
          #7a5634 var(--rh), var(--oak-l) calc(var(--rh) + 1.5px), var(--oak) calc(var(--rh) + 3px),
          var(--oak-d) calc(var(--rh) + var(--pt))),
        repeating-linear-gradient(to bottom, rgba(0,0,0,.75) 0, rgba(0,0,0,.2) 14px, transparent 26px, transparent calc(var(--rh) + var(--pt))),
        repeating-linear-gradient(90deg, rgba(255,230,190,.018) 0 1px, transparent 1px 6px),
        linear-gradient(#150d07, #110a05);
      background-position: 0 0, 0 0, var(--ox) 0, 0 0;
    }
    .slice .plinth {
      height: var(--bh);
      background:
        linear-gradient(var(--gilt), var(--gilt)) top / 100% 1px no-repeat,
        linear-gradient(to bottom, var(--oak-l), var(--oak) 30%, var(--oak-d));
    }

    /* Bölüm dikmesi: meşe direk, demir kuşaklar */
    .post {
      background:
        linear-gradient(var(--iron-l), var(--iron)) 0 calc(var(--ch) + 6px) / 100% 7px no-repeat,
        linear-gradient(var(--iron-l), var(--iron)) 0 calc(100% - var(--bh) - 10px) / 100% 7px no-repeat,
        linear-gradient(90deg, var(--oak-d), var(--oak-hi) 28%, var(--oak-l) 52%, var(--oak) 78%, var(--oak-d));
      box-shadow: 0 0 18px rgba(0,0,0,.7);
    }

    /* Bölüm etiketi: çivilenmiş parşömen */
    .plate {
      display: flex; align-items: center; justify-content: center; gap: .45em; white-space: nowrap;
      padding: 0 1.1em; color: var(--ink);
      font: 700 var(--pf)/1 var(--display);
      background:
        radial-gradient(circle at 7px 50%, #3b3732 0 2.2px, transparent 2.6px),
        radial-gradient(circle at calc(100% - 7px) 50%, #3b3732 0 2.2px, transparent 2.6px),
        var(--grain-soft), linear-gradient(var(--parch-l), var(--parch) 60%, var(--parch-d));
      box-shadow: 0 2px 6px rgba(0,0,0,.7);
    }
    .plate .num { color: var(--rubric); font: 600 .82em/1 var(--serif); letter-spacing: .04em; }

    /* ---------- Kitap sırtı ---------- */
    .bk {
      --bw: 10;
      --shade: linear-gradient(90deg, rgba(0,0,0,.55), rgba(255,240,210,.12) 30%, rgba(255,240,210,.03) 55%, rgba(0,0,0,.5));
      margin: 0; padding: 0; border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      color: var(--g); font: 500 calc(var(--bw) * .5px)/1 var(--serif); font-variant: small-caps; letter-spacing: .04em;
      border-radius: 1.5px 1.5px 0 0;
      background: var(--shade), var(--c);
      box-shadow: inset 0 0 0 .5px rgba(0,0,0,.6);
      transition: opacity .3s;
    }
    .bk span { writing-mode: vertical-rl; transform: rotate(180deg); max-height: 86%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 0 2px rgba(0,0,0,.5); pointer-events: none; }
    .bk.b-vellum span { text-shadow: none; font-style: italic; }
    /* Rafta minik yazılar okunmuyordu ve açılışta çizimi en pahalı kısımdı (ölçüm: takılma 1,6 sn → 0,4 sn).
       Raftaki sırtta yazı satırını andıran yaldız çizgiler durur; okunur başlık mercekte büyüyen kopyada çıkar. */
    .slice .bk span { display: none; }
    .slice .bk::before {
      content: ''; position: absolute; left: 41%; right: 41%; top: 20%; bottom: 24%;
      background: repeating-linear-gradient(to bottom, var(--g) 0 1.6px, transparent 1.6px 2.6px, var(--g) 2.6px 3.4px, transparent 3.4px 5.2px);
      opacity: .5; border-radius: 1px;
    }
    .slice .bk.b-label::before { top: 26%; bottom: 30%; }
    /* kabartma sırt bantları */
    .bk.b-bands {
      background:
        linear-gradient(to bottom,
          transparent 9%, rgba(0,0,0,.55) 9% 10%, rgba(255,235,200,.16) 10% 11.5%, transparent 11.5% 87%,
          rgba(0,0,0,.55) 87% 88%, rgba(255,235,200,.16) 88% 89.5%, transparent 89.5%),
        var(--shade), var(--c);
    }
    /* kör baskı çerçeve */
    .bk.b-tooled { box-shadow: inset 0 0 0 calc(var(--bw) * .1px) rgba(0,0,0,.35), inset 0 0 0 calc(var(--bw) * .16px) rgba(210,176,106,.28); }
    /* deri isim etiketi */
    .bk.b-label { background: linear-gradient(var(--lab), var(--lab)) center 50% / 78% 64% no-repeat, var(--shade), var(--c); }
    /* parşömen cilt */
    .bk.b-vellum { background: linear-gradient(90deg, rgba(60,40,10,.35), rgba(255,250,235,.25) 35%, transparent 60%, rgba(60,40,10,.3)), var(--grain), var(--c); }
    /* demir kabaralar */
    .bk.b-boss {
      background:
        radial-gradient(circle at 50% 5%, #6d675e 0 9%, #2a2724 11% 15%, transparent 16%),
        radial-gradient(circle at 50% 95%, #6d675e 0 9%, #2a2724 11% 15%, transparent 16%),
        var(--shade), var(--c);
    }
    /* zincirli kitap: alt uçta demir halka */
    .bk.b-chain::after {
      content: ''; position: absolute; left: 50%; bottom: 1.5%; width: 56%; aspect-ratio: 1; transform: translateX(-50%);
      border: calc(var(--bw) * .09px) solid #6b665e; border-radius: 50%;
    }
    .bk.is-out { opacity: 0; pointer-events: none; }
    .bk.hit { box-shadow: 0 0 0 1.5px var(--gilt-l), 0 0 12px rgba(var(--candle), .8); }

    /* Kitap künyesi: imlecin yanında parşömen etiket */
    .tip {
      position: fixed; left: 0; top: 0; z-index: 60; max-width: 320px; padding: 10px 14px 9px; pointer-events: none;
      color: var(--ink); background: var(--grain-soft), linear-gradient(var(--parch-l), var(--parch));
      border: 1px solid #8f7a52; border-radius: 2px; box-shadow: 0 10px 30px rgba(0,0,0,.65);
      opacity: 0; transition: opacity .15s;
    }
    .tip.show { opacity: 1; }
    .tip b { display: block; font: 700 22px/1.1 var(--display); }
    .tip span { display: block; margin-top: 3px; font-style: italic; color: var(--ink-soft); }
    .tip small { display: block; margin-top: 4px; font-size: 14px; font-variant: small-caps; letter-spacing: .08em; color: var(--rubric); }

    .hint {
      position: absolute; inset: auto 0 10px; z-index: 10; margin: 0; padding: 0 16px; text-align: center;
      font-style: italic; font-size: 16px; color: rgba(233,219,182,.66);
    }

    /* =========================================================
       OKUMA KÖŞEM: sağdan kayan, isli cam panel (Popover API)
       ========================================================= */
    .drawer {
      position: fixed; inset: 0 0 0 auto; margin: 0; border: 0;
      width: min(420px, 92vw); height: 100dvh; max-height: none; padding: 28px 24px;
      overflow-y: auto; overscroll-behavior: contain; color: var(--parch);
      background: linear-gradient(160deg, rgba(40,28,16,.55), rgba(12,9,6,.62));
      -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
      box-shadow: inset 1px 0 0 rgba(173,133,56,.5), -30px 0 60px -20px rgba(0,0,0,.8);
    }
    .drawer::backdrop { background: rgba(0,0,0,.3); }
    .drawer:popover-open { animation: drawer-in .5s cubic-bezier(.16,1,.3,1) both; }
    @keyframes drawer-in { from { transform: translateX(100%); } to { transform: none; } }
    .drawer h2 { margin: 0; font: 700 40px/1.1 var(--display); }
    .drawer .lead { margin: 6px 0 0; font-style: italic; color: rgba(233,219,182,.78); }
    .x {
      position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; display: grid; place-items: center;
      border: 1px solid rgba(233,219,182,.18); border-radius: 999px; background: rgba(255,255,255,.06); cursor: pointer;
      transition: background .15s;
    }
    .x:hover { background: rgba(255,255,255,.14); }
    .fav-list { list-style: none; margin: 22px 0 0; padding: 0; border-top: 1px solid rgba(233,219,182,.18); }
    .fav-list li { display: flex; align-items: baseline; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(233,219,182,.18); }
    .fav-list .open { flex: 1; text-align: left; padding: 0; border: 0; background: none; cursor: pointer; }
    .fav-list .open b { display: block; font: 700 21px/1.15 var(--display); }
    .fav-list .open i { color: rgba(233,219,182,.7); }
    .fav-list .open:hover b { text-decoration: underline; text-underline-offset: 3px; }
    .fav-list .rm { border: 0; background: none; color: rgba(233,219,182,.55); cursor: pointer; font-size: 15px; }
    .fav-list .rm:hover { color: #e48a76; }
    .linkish { border: 0; background: none; padding: 0; color: rgba(233,219,182,.65); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 15px; }
    .empty { margin-top: 22px; font-style: italic; color: rgba(233,219,182,.75); }

    /* =========================================================
       OKUMA PENCERESİ: ışık hüzmesi altında açılan el yazması
       ========================================================= */
    .reader {
      width: min(1100px, 95vw); max-height: 94dvh; margin: auto; padding: 18px; border: 0;
      background: transparent; color: var(--ink); overflow: auto; overscroll-behavior: contain;
    }
    .reader::backdrop { background: rgba(6,4,3,.9); } /* diğer kitaplar gölgede kalır */
    .shaft { /* yüksek pencereden süzülen ışık hüzmesi */
      position: fixed; inset: 0; pointer-events: none; z-index: 0; filter: blur(22px);
    }
    .shaft::before {
      content: ''; position: absolute; inset: -10% 0 0;
      clip-path: polygon(22% 0, 40% 0, 78% 100%, 30% 100%);
      background: linear-gradient(to bottom, rgba(255,226,176,.22), rgba(255,214,160,.08) 70%, transparent);
    }
    .shaft::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse min(48vw, 680px) min(42dvh, 400px) at 52% 52%, rgba(255,214,160,.2), transparent 70%);
    }
    .reader:popover-open .shaft { animation: light-in .7s ease-out both; }
    @keyframes light-in { from { opacity: 0; } to { opacity: 1; } }

    .codex {
      position: relative; z-index: 1; display: grid; grid-template-columns: 1fr; perspective: 2200px;
      padding: 14px; border-radius: 6px;
      background: var(--grain), linear-gradient(135deg, #4a2a17, #2a170c);
      box-shadow: 0 50px 110px -20px rgba(0,0,0,.95), inset 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 4px rgba(173,133,56,.25);
    }
    .reader:popover-open .codex { animation: arrive .8s .2s cubic-bezier(.16,1,.3,1) both; }
    @keyframes arrive { from { opacity: 0; transform: translateY(40px) scale(.9) rotateX(12deg); } to { opacity: 1; transform: none; } }

    .leaf {
      position: relative; padding: 34px 26px 56px; min-width: 0;
      background: var(--grain-soft), radial-gradient(ellipse at 50% 35%, #f8f0da, #efe3c4 55%, #dcc89c);
    }
    .leaf-l { border-radius: 3px 3px 0 0; }
    .leaf-r { border-radius: 0 0 3px 3px; }
    @media (min-width: 820px) {
      .codex { grid-template-columns: 1fr 1.25fr; min-height: min(680px, 86dvh); }
      .leaf { padding: 44px 46px 60px; }
      .leaf-l { border-radius: 3px 0 0 3px; box-shadow: inset -36px 0 40px -28px rgba(80,45,10,.55), -3px 0 0 #d6c599, -6px 0 0 #c3ae80; }
      .leaf-r { border-radius: 0 3px 3px 0; box-shadow: inset 36px 0 40px -28px rgba(80,45,10,.55), 3px 0 0 #d6c599, 6px 0 0 #c3ae80; }
    }
    .folio { position: absolute; left: 0; right: 0; bottom: 18px; margin: 0; text-align: center; font-style: italic; color: #8a7252; }

    /* minyatür çerçevesi: lacivert-kırmızı-yaldız bordür içinde kapak */
    .mini {
      position: relative; width: min(200px, 62%); aspect-ratio: 2 / 3; margin: 0 auto; padding: 7px;
      background: var(--lapis); border: 3px solid var(--gilt);
      box-shadow: 0 0 0 3px var(--rubric), 0 0 0 4px var(--gilt), 0 22px 30px -14px rgba(60,30,5,.7);
    }
    .mini img, .mini .cover-draw { width: 100%; height: 100%; display: block; object-fit: cover; }
    .mini img[hidden], .mini .cover-draw[hidden] { display: none; }
    .cover-draw {
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; padding: 14px; text-align: center;
      color: var(--gilt-l); background: var(--grain), linear-gradient(90deg, rgba(0,0,0,.4), transparent 20%), #4a1f14;
      box-shadow: inset 0 0 0 6px rgba(0,0,0,.25), inset 0 0 0 7px rgba(210,176,106,.6);
    }
    .mini .cover-draw { display: flex; }
    .cover-draw b { font: 700 22px/1.1 var(--display); }
    .cover-draw i { font-size: 15px; }
    .mini figcaption { position: absolute; left: -20px; right: -20px; top: calc(100% + 12px); text-align: center; font-size: 14px; font-style: italic; color: #7d664a; }

    .colophon { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 52px auto 0; max-width: 340px; font-size: 17px; }
    .colophon dt { font-variant: small-caps; letter-spacing: .08em; color: var(--rubric); }
    .colophon dd { margin: 0; }

    .rubric { margin: 0; font-variant: small-caps; letter-spacing: .14em; color: var(--rubric); font-size: 16px; }
    .r-title { margin: 6px 0 0; font: 700 clamp(32px, 4.2vw, 50px)/1.02 var(--display); color: #1d140c; }
    .r-author { margin: 6px 0 0; font-style: italic; font-size: 20px; color: var(--ink-soft); }
    .fleuron { margin: 12px 0; text-align: center; color: var(--rubric); font-size: 22px; }
    .prose { font-size: 19px; line-height: 1.55; text-align: justify; hyphens: auto; color: #2e2116; }
    .prose p { margin: 0; }
    .prose p + p { margin-top: .6em; text-indent: 1.4em; }
    .prose p:first-child::first-letter { /* tezhipli baş harf */
      float: left; margin: 4px 10px 0 0; padding: 5px 9px 3px;
      font: 700 3.1em/.85 var(--display); color: var(--rubric);
      background: var(--gilt-l); border: 2px solid var(--lapis); box-shadow: inset 0 0 0 2px var(--parch-l);
    }
    .prose .none { font-style: italic; color: var(--ink-soft); }
    .source { margin: 18px 0 0; font-size: 15px; color: var(--ink-soft); }
    .source a { color: var(--lapis); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-top: 22px; }
    .seal {
      display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(122,34,21,.45); background: rgba(122,34,21,.06); color: #7a2215; font-size: 17px;
      transition: background .15s, color .15s, border-color .15s;
    }
    .seal:hover { background: rgba(122,34,21,.12); border-color: rgba(122,34,21,.7); }
    .seal[aria-pressed="true"] { background: linear-gradient(145deg, #b13a24, #7a2215); color: #fff7e6; border-color: transparent; }
    .actions a {
      display: inline-flex; align-items: center; height: 42px; padding: 0 6px; color: var(--lapis); font-size: 17px;
      text-decoration: underline; text-decoration-color: rgba(44,71,120,.35); text-underline-offset: 4px;
    }
    .actions a:hover { text-decoration-color: currentColor; }

    .r-close {
      position: absolute; top: -14px; right: -14px; z-index: 10; width: 42px; height: 42px; border-radius: 999px;
      display: grid; place-items: center; cursor: pointer; border: 0; color: #fff7e6;
      background: linear-gradient(145deg, #b13a24, #7a2215);
      box-shadow: 0 8px 20px -8px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.12);
      transition: transform .15s;
    }
    .r-close:hover { transform: scale(1.06); }

    /* açılış: önce cilt kapağı, sonra bir yaprak döner */
    .flap, .flip {
      position: absolute; top: 14px; bottom: 14px; left: 14px; right: 14px;
      transform-origin: left center; -webkit-backface-visibility: hidden; backface-visibility: hidden;
      pointer-events: none; z-index: 5;
    }
    @media (min-width: 820px) { .flap, .flip { left: 44.4%; } }
    .flip { background: var(--grain-soft), linear-gradient(90deg, #dccb9f, #f3e8cc 35%); }
    .flap {
      display: grid; place-items: center; text-align: center; padding: 24px; color: var(--gilt-l);
      background: var(--grain), linear-gradient(90deg, rgba(0,0,0,.45), rgba(255,255,255,.06) 6%, transparent 30%), #4a1f14;
      box-shadow: inset 0 0 0 14px rgba(0,0,0,.18), inset 0 0 0 16px rgba(210,176,106,.55), inset 0 0 0 22px transparent, inset 0 0 0 23px rgba(210,176,106,.4);
      border-radius: 0 4px 4px 0; font: 700 34px/1.1 var(--display);
    }
    .reader:popover-open .flap { animation: turn 1.1s .6s cubic-bezier(.6,.05,.3,1) both; }
    .reader:popover-open .flip { animation: turn 1s .85s cubic-bezier(.6,.05,.3,1) both; }
    @keyframes turn { from { transform: rotateY(0); } to { transform: rotateY(-180deg); } }
    .reader:popover-open .ink { animation: ink .9s 1.35s ease both; }
    @keyframes ink { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: none; } }

    /* Hareket hassasiyeti: animasyonlar kapanır, statik görünüm kalır */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .flap, .flip { display: none; }
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="#" aria-label="Bibliotheca ana sayfa"><span class="mono" aria-hidden="true">B</span><span class="word">Bibliotheca</span></a>
    <form id="search" class="search" role="search">
      <label for="q" class="sr-only">Eser veya yazar ara</label>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Eser ya da yazar ara…" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <kbd aria-hidden="true">/</kbd>
      <ul id="results" class="results" role="listbox" aria-label="Arama sonuçları" hidden></ul>
    </form>
    <div id="modes" class="modes" role="radiogroup" aria-label="Kitaplık görünümü">
      <button type="button" role="radio" data-mode="dis" aria-checked="true" aria-label="Dışbükey" title="Dışbükey"><svg viewBox="0 0 26 18" aria-hidden="true"><path d="M3 13 Q13 3 23 13"/></svg></button>
      <button type="button" role="radio" data-mode="ic" aria-checked="false" aria-label="İçbükey" title="İçbükey — seni saran"><svg viewBox="0 0 26 18" aria-hidden="true"><path d="M3 5 Q13 15 23 5"/></svg></button>
      <button type="button" role="radio" data-mode="duz" aria-checked="false" aria-label="Düz (hafif)" title="Düz — hafif görünüm"><svg viewBox="0 0 26 18" aria-hidden="true"><path d="M3 9 L23 9"/></svg></button>
    </div>
    <button type="button" class="btn" popovertarget="drawer" aria-label="Okuma Köşem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      <span class="label">Okuma Köşem</span>
      <span class="count" id="fav-count-nav">0</span>
    </button>
  </header>

  <main class="stage" aria-labelledby="hall-title">
    <h1 id="hall-title" class="sr-only">Bibliotheca — manastır kitaplığı</h1>
    <div class="candle l" aria-hidden="true"></div>
    <div class="candle r" aria-hidden="true"></div>
    <div id="drum" class="drum"></div>
    <p id="hint" class="hint" aria-live="polite"></p>
  </main>

  <div id="veil" class="veil" hidden></div>
  <div id="tip" class="tip" aria-hidden="true"><b></b><span></span><small></small></div>

  <!-- ===================== OKUMA KÖŞEM ===================== -->
  <aside id="drawer" popover class="drawer" aria-labelledby="drawer-title">
    <button type="button" class="x" popovertarget="drawer" popovertargetaction="hide" aria-label="Okuma Köşemi kapat">✕</button>
    <h2 id="drawer-title">Okuma Köşem</h2>
    <p class="lead"><span id="fav-count">0</span> cilt ayırdın. <button type="button" id="fav-clear" class="linkish">Rafı boşalt</button></p>
    <ol id="fav-list" class="fav-list"></ol>
    <p id="fav-empty" class="empty" hidden>Bu raf henüz boş. Bir kitabı açıp “Okuma Köşeme ekle”ye bas.</p>
  </aside>

  <!-- ===================== OKUMA PENCERESİ ===================== -->
  <div id="reader" popover class="reader" role="dialog" aria-modal="true" aria-labelledby="r-title">
    <div class="shaft" aria-hidden="true"></div>
    <article class="codex">
      <button type="button" class="r-close" popovertarget="reader" popovertargetaction="hide" aria-label="Kitabı kapat">✕</button>

      <section class="leaf leaf-l">
        <figure class="mini">
          <img id="r-img" alt="" hidden>
          <div id="r-draw" class="cover-draw"><b id="r-draw-t"></b><i id="r-draw-a"></i></div>
          <figcaption id="r-cap"></figcaption>
        </figure>
        <dl id="r-meta" class="colophon"></dl>
        <p class="folio">i</p>
      </section>

      <section class="leaf leaf-r">
        <div class="ink">
          <p class="rubric">Kitap hakkında</p>
          <h2 id="r-title" class="r-title"></h2>
          <p id="r-author" class="r-author"></p>
          <p class="fleuron" aria-hidden="true">❧</p>
          <div id="r-summary" class="prose"></div>
          <p id="r-source" class="source"></p>
          <div class="actions">
            <button type="button" id="r-fav" class="seal" aria-pressed="false">Okuma Köşeme ekle</button>
            <a id="r-ol" href="https://openlibrary.org" target="_blank" rel="noopener">Open Library'de incele ↗</a>
          </div>
        </div>
        <p class="folio">ii</p>
      </section>

      <div class="flip" aria-hidden="true"></div>
      <div id="r-flap" class="flap" aria-hidden="true"></div>
    </article>
  </div>

  <script src="data/index.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
